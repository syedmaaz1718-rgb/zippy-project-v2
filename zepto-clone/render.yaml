# Render Blueprint: one web service serving the API and the built React app.
# Deploy: push this repo to GitHub > Render dashboard > New > Blueprint > pick the repo.
services:
  - type: web
    name: zippy
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      # Add these in the Render dashboard (Environment tab) to turn on Razorpay test payments:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
    # The free plan has an ephemeral disk: the SQLite DB resets on every deploy/restart and the demo data is re-seeded.
    # For persistent data use a paid plan and uncomment:
    # disk:
    #   name: zippy-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and set the env var DB_FILE=/var/data/zippy.db
